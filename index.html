<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VYRA PartyPass</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>
:root{--bg:#07070a;--card:#111116;--line:#26262f;--gold:#d9b46a;--tx:#f3f1ec;--mut:#8b8a93}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 50% -10%,#1d1630,transparent),var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 60px}
header{text-align:center;margin-bottom:26px}
h1{font-size:44px;letter-spacing:.35em;margin:0 0 0 .35em;font-weight:300}
.tag{color:var(--gold);letter-spacing:.3em;font-size:12px;text-transform:uppercase;margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
label{display:block;font-size:11px;letter-spacing:.2em;color:var(--mut);text-transform:uppercase;margin:14px 0 8px}
input,select{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#0b0b0f;color:var(--tx);font-size:16px}
button{cursor:pointer;font:inherit;letter-spacing:.2em;text-transform:uppercase;font-size:13px;border-radius:12px;padding:15px;border:0}
.primary{width:100%;margin-top:20px;background:linear-gradient(135deg,#e8c982,#b8924a);color:#16120a;font-weight:700}
.primary:disabled{opacity:.5;cursor:not-allowed}
.ghost{background:transparent;border:1px solid var(--line);color:var(--tx)}
.row{display:flex;gap:10px;margin-top:14px}
.row button{flex:1}
#err{color:#ff6b6b;margin-top:12px;font-size:14px;min-height:18px}
#out{display:none;margin-top:26px;text-align:center}
canvas#cv{width:100%;max-width:380px;border-radius:14px;border:1px solid var(--line);box-shadow:0 20px 60px #000a}
#qrbox{position:absolute;left:-9999px;top:0}
</style>
</head>

<body>
<div class="wrap">

  <header>
    <h1>VYRA</h1>
    <div class="tag">Beyond the ordinary</div>
  </header>

  <div class="card">
    <label for="name">Guest Name</label>
    <input id="name" maxlength="60" placeholder="Full name" autocomplete="off"/>

    <label for="type">Pass Type</label>
    <select id="type">
      <option>Regular</option>
      <option>Early Bird</option>
      <option>Couple</option>
      <option>Surge Pass</option>
      <option>Guest List</option>
      <option>Organizers</option>
    </select>

    <button class="primary" id="gen">Generate Pass</button>
    <div id="err"></div>
  </div>

  <div id="out">
    <canvas id="cv" width="1000" height="1500"></canvas>
    <div class="row">
      <button class="ghost" id="dl">Download PDF</button>
      <button class="ghost" id="pr">Print</button>
    </div>
  </div>

</div>

<div id="qrbox"></div>

/* QR sits in the gap between the tagline and "OCT 25 | 2:30 PM".
   Nudge QR_BOX_Y up/down if needed. */
const QR_SIZE  = 134;
const QR_PAD   = 8;
const QR_BOX_Y = 1023;

/* ===================== HELPERS ===================== */

const $ = id => document.getElementById(id);
let lastPass = null;

function loadImg(src){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    /* only use CORS for images from another website */
    if(/^https?:/i.test(src) && !src.startsWith(location.origin)){
      img.crossOrigin = "anonymous";
    }
    img.onload  = () => resolve(img);
    img.onerror = () => reject(new Error("Image could not be loaded: " + src));
    img.src = src;
  });
}

function makeQR(text){
  const box = $("qrbox");
  box.innerHTML = "";
  new QRCode(box,{
    text: text,
    width: 400,
    height: 400,
    colorDark: "#000000",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.M
  });
  return box.querySelector("canvas");
}

/* ===================== DRAW TICKET ===================== */

async function drawTicket(d){

  const canvas = $("cv");
  const x = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  x.fillStyle = "#0a0a0f";
  x.fillRect(0,0,W,H);

  /* poster */
  try{
    const bg = await loadImg(d.background || DEFAULT_BACKDROP);
    const scale = Math.max(W / bg.width, H / bg.height);
    x.drawImage(
      bg,
      (W - bg.width * scale) / 2,
      (H - bg.height * scale) / 2,
      bg.width * scale,
      bg.height * scale
    );
  }catch(e){
    console.warn("Background could not be loaded.", e);
    const g = x.createLinearGradient(0,0,W,H);
    g.addColorStop(0,"#b9a67f");
    g.addColorStop(1,"#d8c9a3");
    x.fillStyle = g;
    x.fillRect(0,0,W,H);
    x.fillStyle = "#3b2f1a";
    x.textAlign = "center";
    x.font = "28px sans-serif";
    x.fillText("Poster image missing - check file name/location", W/2, 700);
  }

  /* QR between tagline and date */
  const qrData = d.qr_data || d.pass_id;
  if(qrData){
    const qrCanvas = makeQR(qrData);
    if(qrCanvas){
      const boxS = QR_SIZE + QR_PAD * 2;
      const bx = (W - boxS) / 2;
      const by = QR_BOX_Y;

      x.fillStyle = "#ffffff";
      x.fillRect(bx, by, boxS, boxS);
      x.strokeStyle = "#b8924a";
      x.lineWidth = 2;
      x.strokeRect(bx, by, boxS, boxS);
      x.drawImage(qrCanvas, bx + QR_PAD, by + QR_PAD, QR_SIZE, QR_SIZE);
    }
  }

  /* pass holder info, bottom strip */
  x.textAlign = "center";
  const line = String(d.guest_name || "").toUpperCase() +
               "  \u2022  " +
               String(d.pass_type || "").toUpperCase();

  let fontSize = 30;
  x.font = "700 " + fontSize + "px sans-serif";
  while(x.measureText(line).width > W - 160 && fontSize > 16){
    fontSize -= 2;
    x.font = "700 " + fontSize + "px sans-serif";
  }
  x.fillStyle = "#3b2f1a";
  x.fillText(line, W / 2, 1434);

  x.font = "20px monospace";
  x.fillStyle = "#4a3c22";
  x.fillText("Pass ID: " + (d.pass_id || ""), W / 2, 1464);
}

/* ===================== GENERATE ===================== */

$("gen").onclick = async () => {

  const name = $("name").value.trim();
  const type = $("type").value;

  $("err").textContent = "";

  if(!name){
    $("err").textContent = "Enter the guest name.";
    return;
  }

  $("gen").disabled = true;
  $("gen").textContent = "Generating\u2026";

  try{
    const url =
      API_URL +
      "?action=generate" +
      "&name=" + encodeURIComponent(name) +
      "&type=" + encodeURIComponent(type);

    const response = await fetch(url,{method:"GET",redirect:"follow"});
    if(!response.ok) throw new Error("Backend returned HTTP " + response.status);

    const data = await response.json();
    if(!data.ok) throw new Error(data.message || "Failed to generate pass.");

    lastPass = data;
    await drawTicket(data);

    $("out").style.display = "block";
    $("out").scrollIntoView({behavior:"smooth"});

  }catch(error){
    console.error("Generation error:", error);
    $("err").textContent =
      "Could not generate pass. " + (error.message || "Please try again.");
  }

  $("gen").disabled = false;
  $("gen").textContent = "Generate Pass";
};

/* ===================== DOWNLOAD PDF ===================== */

$("dl").onclick = async () => {

  if(!lastPass){
    $("err").textContent = "Generate a pass first.";
    return;
  }

  try{
    const { jsPDF } = window.jspdf || {};
    if(!jsPDF) throw new Error("PDF library failed to load.");

    const canvas = $("cv");
    const image  = canvas.toDataURL("image/png", 1.0);

    const pdf = new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
    const pageWidth  = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const margin = 10;

    const availableWidth  = pageWidth  - margin * 2;
    const availableHeight = pageHeight - margin * 2;
    const ratio = canvas.width / canvas.height;

    let width  = availableWidth;
    let height = width / ratio;
    if(height > availableHeight){
      height = availableHeight;
      width  = height * ratio;
    }

    pdf.addImage(image,"PNG",(pageWidth-width)/2,(pageHeight-height)/2,width,height,undefined,"FAST");

    const safeName = String(lastPass.guest_name || "Guest").trim().replace(/[^a-z0-9]/gi,"_");
    pdf.save("VYRA-" + safeName + "-" + String(lastPass.pass_id || "Pass") + ".pdf");

  }catch(error){
    console.error("PDF generation error:", error);
    $("err").textContent =
      "Could not create PDF. " + (error.message || "Please try again.");
  }
};

/* ===================== PRINT ===================== */

$("pr").onclick = () => {

  if(!lastPass){
    $("err").textContent = "Generate a pass first.";
    return;
  }

  let image;
  try{
    image = $("cv").toDataURL("image/png");
  }catch(e){
    $("err").textContent = "Cannot print from file://. Open with Live Server.";
    return;
  }

  const win = window.open("");
  if(!win){
    $("err").textContent = "Please allow pop-ups to print the ticket.";
    return;
  }

  win.document.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <title>${lastPass.pass_id || "VYRA Pass"}</title>
      <style>
        body{margin:0;padding:20px;text-align:center;background:#fff}
        img{width:100%;max-width:520px}
        @media print{ body{padding:0} img{max-width:100%} }
      </style>
    </head>
    <body>
      <img src="${image}" onload="window.print()">
    </body>
    </html>
  `);
  win.document.close();
};
</script>
